[project]
name = "claude-agents"
version = "0.1.0"
description = "A small, flexible framework for building AI agents on the Anthropic Claude API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[project.scripts]
claude-agent = "claude_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agents"]

[tool.ruff]
line-length = 100
target-version = "py310"
